name: time_pilot
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.0.1
  google_generative_ai: ^0.4.7
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.4.0
  http: ^1.6.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  latlong2: ^0.10.1
  local_auth: ^3.0.2
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  image: ^4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.3
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
  assets:
    - assets/images/logo.png
    - assets/images/puzzle.jpg